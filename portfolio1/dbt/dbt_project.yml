
name: 'seoul_commercial_dbt'
version: '1.0.0'
config-version: 2

profile: 'portfolio1_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


seeds:
  seoul_commercial_dbt:
    +schema: mart
    dim_time_bucket:
      +column_types:
        bucket_id: int64
        label: string
        start_hour: int64
        end_hour: int64

models:
  seoul_commercial_dbt:   # ← 내 프로젝트 name에 맞춰야 함 (name: 값)
    staging:
      +materialized: view
      +schema: stg
    marts:
      +materialized: table
      +schema: mart
